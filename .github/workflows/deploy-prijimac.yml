name: Odboráčik – prijímač dotazov
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/configure.mjs', 'tests/**', '.github/workflows/deploy-prijimac.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odboracik-backend
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.BACKEND_ENABLED == 'true'
    environment: odboracik-production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node scripts/configure.mjs backend
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
          PRIVACY_READY: ${{ vars.PRIVACY_READY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_FROM_EMAIL: ${{ vars.CONTACT_FROM_EMAIL }}
          SECRETS_FILE: ${{ runner.temp }}/odboracik-secrets.json
      - name: Pripraviť databázovú tabuľku
        run: npx --yes wrangler@4 d1 execute DB --remote --config backend/wrangler.json --file backend/schema.sql
      - name: Nasadiť prijímač a tajné kľúče
        run: npx --yes wrangler@4 deploy --config backend/wrangler.json --secrets-file "$RUNNER_TEMP/odboracik-secrets.json"
      - name: Vymazať dočasné tajomstvá
        if: always()
        run: rm -f "$RUNNER_TEMP/odboracik-secrets.json"
