<path d="M170 268C139 270 129 294 145 311" fill="none" stroke="#2E6F95" stroke-width="22"/><circle cx="146" cy="311" r="14" fill="#DDECF3"/>
<g class="wave"><path d="M330 267C371 269 392 247 392 210" fill="none" stroke="#E0524D" stroke-width="22"/><rect x="377" y="168" width="31" height="48" rx="15" fill="#E0524D"/><path d="M387 174L384 158M399 174L402 158" stroke="#E0524D" stroke-width="8"/></g>
<path d="M209 135L209 149" stroke="#2E6F95" stroke-width="9"/><path d="M281 135L281 149" stroke="#E0524D" stroke-width="9"/><circle cx="209" cy="114" r="22" fill="#2E6F95"/><circle cx="281" cy="114" r="22" fill="#E0524D"/>
<rect x="224" y="153" width="133" height="179" rx="58" fill="#E0524D"/><path d="M312 305L344 351L348 304Z" fill="#E0524D"/>
<rect x="157" y="147" width="190" height="177" rx="56" fill="#2E6F95"/><path d="M177 295L170 348L220 314Z" fill="#2E6F95"/>
<rect x="176" y="173" width="149" height="102" rx="34" fill="#123B5D"/>
<g class="eyes" fill="#FFFFFF"><ellipse cx="215" cy="209.5" rx="10" ry="15.5"/><ellipse cx="285" cy="209.5" rx="10" ry="15.5"/></g>
<path d="M232 239C243 251 256 251 268 239" stroke="#FFFFFF" stroke-width="5" fill="none"/>
<g fill="#DDECF3"><circle class="dot" cx="228" cy="294" r="5"/><circle class="dot d2" cx="250" cy="294" r="5"/><circle class="dot d3" cx="272" cy="294" r="5"/></g>
<rect x="357" y="102" width="76" height="43" rx="14" fill="#FFFFFF"/><path d="M367 139L359 154L389 140Z" fill="#FFFFFF"/>
<g fill="#E0524D"><circle class="dot" cx="375" cy="123" r="4"/><circle class="dot d2" cx="395" cy="123" r="4"/><circle class="dot d3" cx="415" cy="123" r="4"/></g>
</g>
<g text-anchor="middle" font-family="Arial,sans-serif"><text x="256" y="438" font-size="34" font-weight="bold" fill="#FFFFFF">Odboráčik</text><text x="256" y="465" font-size="17" fill="#DDECF3">Tvoj odborový chatbot</text><text x="256" y="491" font-size="12" fill="#DDECF3">ZO Packeta Slovakia</text></g></svg>