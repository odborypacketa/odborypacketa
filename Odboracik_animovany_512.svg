<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Odboráčik — odborový chatbot</title><desc id="desc">Priateľská modro-červená postavička inšpirovaná motívom rozhovoru v logu ZO Packeta Slovakia. Jemne sa pohupuje, mrká, máva a pri nej pulzujú tri bodky v bielej rečovej bubline.</desc>
<style>
.bob{animation:bob 3s ease-in-out infinite}.wave{transform-origin:333px 260px;animation:wave 1.5s ease-in-out infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 3s infinite}.dot{animation:dot 1.2s ease-in-out infinite}.d2{animation-delay:.18s}.d3{animation-delay:.36s}
@keyframes bob{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-5px)}75%{transform:translateY(5px)}}
@keyframes wave{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes blink{0%,30%,37%,86%,94%,100%{transform:scaleY(1)}33%,90%{transform:scaleY(.14)}}
@keyframes dot{0%,100%{opacity:.55}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.bob,.wave,.eyes,.dot{animation:none}}
</style>
<rect width="512" height="512" fill="#123B5D"/><circle cx="252" cy="237" r="175" fill="none" stroke="#2E6F95"/><ellipse cx="252" cy="380" rx="82" ry="7" fill="#103650"/>
<g class="bob" stroke-linecap="round" stroke-linejoin="round">
